[project]
name = "ablating-archetypes"
version = "0.1.0"
description = "Reproduction code for: Ablating Archetypes"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "matplotlib",
    "einops",
    "scikit-learn>=1.2.0",
    "scikit-image",
    "scipy",
    "opencv-python",
    "Pillow",
    "transformers",
    "jupyter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
